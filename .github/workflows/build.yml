name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache
          pip install --upgrade pip
          pip install buildozer "cython==0.29.36" virtualenv
      - name: Build APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Show error
        if: failure()
        run: tail -n 60 build.log
      - name: Rename APK
        run: cp bin/*.apk myra-ai.apk
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Myra AI build ${{ github.run_number }}
          files: myra-ai.apk
